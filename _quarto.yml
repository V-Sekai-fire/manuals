project:
  type: website
  output-dir: _site
  # Quarto excludes README.md from rendering by default (it assumes a
  # GitHub-viewed readme, not a site page). rfd/ uses README.md as each
  # RFD's actual page, matching weftspun/request-for-discussion's own
  # folder-per-RFD convention, so re-include those.
  #
  # This was 100 hand-written paths, and it silently dropped every RFD
  # nobody remembered to add: 0093 through 0099 were all missing, and
  # the published index stopped at 0092. Merging an RFD does not
  # publish it. Listing it does.
  #
  # A glob cannot drift. pages/rfd.qmd already globs the same files
  # for its listing ("../rfd/**/README.md"), so this pattern is not a
  # new risk here -- it is the pattern that page already relies on.
  render:
    - "**/*.qmd"
    - "**/*.ipynb"
    - "**/*.md"
    - "rfd/**/README.md"

resources:
  - decisions/attachments

website:
  site-url: https://v-sekai-multiplayer-fabric.github.io/manuals
  repo-url: https://github.com/v-sekai-multiplayer-fabric/manuals
  repo-branch: main
  repo-actions: edit
  title: V-Sekai Fire — Manuals
  page-navigation: true
  navbar:
    background: primary
    search: true
    left:
      - text: "Changes"
        file: pages/changelog.qmd
      - text: "RFDs"
        file: pages/rfd.qmd
      - text: "References"
        file: pages/references.qmd
  page-footer:
    right:
      - icon: github
        href: https://github.com/v-sekai-multiplayer-fabric/multiplayer-fabric-manuals

format:
  html:
    toc: true
    theme:
      light: flatly
      dark: darkly

filters:
  - quarto
  - scripts/decision-meta.py

freeze: true
