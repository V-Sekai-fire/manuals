project:
  type: website
  output-dir: _site
  # Each RFD's page is rfd/NNNN-name/index.md, and "**/*.md" below
  # picks it up with no further configuration.
  #
  # It used to be README.md, which Quarto excludes from rendering by
  # default because it assumes a GitHub-viewed readme rather than a
  # site page. Overriding that needed one exact path per RFD, and the
  # list fell behind: 93 paths against 100 directories, so 0093 through
  # 0099 never rendered and the published index stopped at 0092.
  #
  # A glob does NOT fix that. "rfd/**/README.md" was tried, the render
  # job passed, and it emitted zero README pages -- Quarto's exclusion
  # wins over a pattern, and only an exact path beats it. So the file
  # is no longer named README.md. There is nothing left to keep in
  # sync.
  render:
    - "**/*.qmd"
    - "**/*.ipynb"
    - "**/*.md"


website:
  site-url: https://v-sekai-multiplayer-fabric.github.io/manuals
  repo-url: https://github.com/v-sekai-multiplayer-fabric/manuals
  repo-branch: main
  repo-actions: edit
  title: V-Sekai Fire — Manuals
  page-navigation: true
  navbar:
    background: primary
    search: true
    left:
      - text: "Changes"
        file: pages/changelog.qmd
      - text: "RFDs"
        file: pages/rfd.qmd
      - text: "References"
        file: pages/references.qmd
  page-footer:
    right:
      - icon: github
        href: https://github.com/v-sekai-multiplayer-fabric/multiplayer-fabric-manuals

format:
  html:
    toc: true
    theme:
      light: flatly
      dark: darkly

filters:
  - quarto
  - scripts/decision-meta.py

freeze: true
