project:
  type: website
  output-dir: _site
  # Quarto excludes README.md from rendering by default (it assumes a
  # GitHub-viewed readme, not a site page). rfd/ uses README.md as each
  # RFD's actual page, matching weftspun/request-for-discussion's own
  # folder-per-RFD convention, so re-include those specifically.
  render:
    - "**/*.qmd"
    - "**/*.ipynb"
    - "**/*.md"
    - "!**/README.md"
    - "rfd/**/README.md"

resources:
  - decisions/attachments

website:
  site-url: https://v-sekai-multiplayer-fabric.github.io/manuals
  repo-url: https://github.com/v-sekai-multiplayer-fabric/manuals
  repo-branch: main
  repo-actions: edit
  title: V-Sekai Fire — Manuals
  page-navigation: true
  navbar:
    background: primary
    search: true
    left:
      - text: "Changes"
        file: changelog.qmd
      - text: "Decisions"
        file: decisions.qmd
      - text: "RFDs"
        file: rfd.qmd
      - text: "References"
        file: references.qmd
  page-footer:
    right:
      - icon: github
        href: https://github.com/v-sekai-multiplayer-fabric/multiplayer-fabric-manuals

format:
  html:
    toc: true
    theme:
      light: flatly
      dark: darkly

filters:
  - quarto
  - filters/decision-meta.py

freeze: true
